services:
  api:
    container_name: mamuy-qr-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "3001:3001"
    environment:
      API_PORT: "3001"
    restart: unless-stopped

  web:
    container_name: mamuy-qr-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://api:3001
    depends_on:
      - api
    restart: unless-stopped
